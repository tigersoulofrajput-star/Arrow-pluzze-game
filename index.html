 if(h.t=="c"){s+=`<ellipse cx="${X(h.x)}" cy="${Y(h.y)}" rx="${sw(h.r)}" ry="${sh(h.r)}"/>`;if(h.i=="star")s+=`<polygon points="${P(spt(h.x,h.y,h.r*.62))}"/>`;if(h.i=="dot")s+=`<ellipse cx="${X(h.x)}" cy="${Y(h.y)}" rx="${sw(h.r*.38)}" ry="${sh(h.r*.38)}" fill="currentColor"/>`}
 if(h.t=="r"){s+=`<rect x="${X(h.x-h.w)}" y="${Y(h.y-h.h)}" width="${sw(h.w*2)}" height="${sh(h.h*2)}"/>`;if(h.w>.15&&h.h>.15)s+=`<path d="M${X(h.x)} ${Y(h.y-h.h*.6)}V${Y(h.y+h.h*.6)}M${X(h.x-h.w*.6)} ${Y(h.y)}H${X(h.x+h.w*.6)}"/>`}
 if(h.t=="o"){const r=h.r,q=r*.42;s+=`<polygon points="${P([[-r,-q],[-q,-r],[q,-r],[r,-q],[r,q],[q,r],[-q,r],[-r,q]].map(p=>[h.x+p[0],h.y+p[1]]))}"/><polygon points="${P(spt(h.x,h.y+.01,r*.66))}"/>`}
 if(h.t=="e")s+=`<ellipse cx="${X(h.x)}" cy="${Y(h.y)}" rx="${sw(h.a)}" ry="${sh(h.b)}"/>`;
 if(h.t=="s")s+=`<polygon points="${P(spt(h.x,h.y,h.r))}"/>`;
 if(h.t=="h"){let d="";for(let t=0;t<=64;t++){const a=t/64*Math.PI*2,x=16*Math.pow(Math.sin(a),3),y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));d+=(t?"L":"M")+X(h.x+x/16*h.k*.9)+" "+Y(h.y+y/16*h.k*.9-.03)}s+=`<path d="${d}Z"/>`}

function ray(a,list){const[hx,hy]=a.c[a.c.length-1],[dx,dy]=a.d;let k=1;
 for(;;k++){const x=hx+dx*k,y=hy+dy*k;if(x<0||y<0||x>=W||y>=H)return{free:true,len:k-1};
  if(list.some(o=>o!==a&&o.c.some(p=>p[0]==x&&p[1]==y)))return{free:false,len:k-1,bx:x,by:y}}}
function mk(t,at,p){const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);(p||$("b")).appendChild(e);return e}
const pathD=pts=>"M"+pts.map(p=>p[0]+" "+p[1]).join("L");
function slice(pts,a,b){const out=[];let acc=0;for(let i=0;i<pts.length-1;i++){const p=pts[i],q=pts[i+1],l=Math.hypot(q[0]-p[0],q[1]-p[1]),s=acc,e=acc+l;
  if(e>a&&s<b){const f=t=>{const u=(Math.min(Math.max(t,s),e)-s)/l;return[p[0]+(q[0]-p[0])*u,p[1]+(q[1]-p[1])*u]};if(!out.length)out.push(f(a));out.push(f(b))}acc=e}return out}
function head(a,pt){const[dx,dy]=a.d,x=pt[0],y=pt[1];return`${x+dx*.56},${y+dy*.56} ${x-dy*.4},${y+dx*.4} ${x+dy*.4},${y-dx*.4}`}

function setZ(nz,fx,fy){autoZ=false;const w=$("wrap"),old=z;fit();z=Math.min(Math.max(nz,fitZ*.6),4);const s=$("b");
 const px=(w.scrollLeft+fx-s.offsetLeft)/old,py=(w.scrollTop+fy-s.offsetTop)/old;
 s.style.width=(W+2*PAD)*CELL*z+"px";s.style.height=(H+2*PAD)*CELL*z+"px";
 w.scrollLeft=px*z+s.offsetLeft-fx;w.scrollTop=py*z+s.offsetTop-fy}
function fit(){const w=$("wrap");fitZ=Math.min((w.clientWidth-8)/((W+.6)*CELL),(w.clientHeight-8)/((H+.6)*CELL));return fitZ}
function initZoom(){const w=$("wrap");fit();z=Math.min(2.4,Math.max(fitZ,.55));setZ(z,0,0);w.scrollLeft=(w.scrollWidth-w.clientWidth)/2;w.scrollTop=0;autoZ=true}
function start(lv){L=lv;MAXL=lv<50?3:lv<150?4:5;lives=MAXL;busy=false;anim=0;hints=lv<60?2:lv<150?3:4;arrows=decode(lv);const svg=$("b");svg.innerHTML="";
 svg.setAttribute("viewBox",`${-PAD} ${-PAD} ${W+2*PAD} ${H+2*PAD}`);svg.style.color="var(--ink)";

 arrows.forEach(a=>{a.g=mk("g",{style:"cursor:pointer;transform-box:fill-box;transform-origin:center"});const pts=a.c.map(c=>[c[0]+.5,c[1]+.5]);a.pts=pts;
  mk("path",{d:pathD(pts),stroke:"transparent","stroke-width":.92,fill:"none","stroke-linecap":"round","stroke-linejoin":"round"},a.g);
  a.p=mk("path",{stroke:"currentColor","stroke-width":.2,fill:"none","stroke-linejoin":"miter"},a.g);
  a.h=mk("polygon",{fill:"currentColor"},a.g);draw(a,pts);a.g.addEventListener("click",()=>{if(!drag)tap(a)})});
 ui();$("win").classList.remove("on");$("lose").classList.remove("on");initZoom()}

 $("lives").innerHTML=Array.from({length:MAXL},(_,i)=>i).map(i=>`<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z" fill="${i<lives?"#ff3b4e":"#c5c9d6"}"/><path d="M7 8.5a2.5 2.5 0 012-1.8" stroke="#fff9" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>`).join("")}
function launch(a,r){const[hx,hy]=a.c[a.c.length-1],[dx,dy]=a.d,B="#2f7bff";
 const ln=mk("line",{x1:hx+.5,y1:hy+.5,x2:hx+.5+dx*r.len,y2:hy+.5+dy*r.len,stroke:B,"stroke-width":.22,"stroke-dasharray":"0 1","stroke-linecap":"round"});
 a.alive=false;a.red=false;anim++;sfx.go();a.p.setAttribute("stroke",B);a.h.setAttribute("fill",B);
 const pts=a.pts,Ln=pts.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1]),0);
 const hp=pts[pts.length-1],tot=r.len+Ln+PAD+1.4,ext=pts.concat([[hp[0]+dx*(tot+Ln+3),hp[1]+dy*(tot+Ln+3)]]),dur=Math.min(Math.max(tot/13,.8),1.9)*1000,t0=performance.now();
 const step=n=>{const p=Math.min((n-t0)/dur,1),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,s=tot*e,op=p>.72?1-(p-.72)/.28:1;
  if(p>=1){a.g.remove();ln.remove();anim--;ui();if(!anim&&!arrows.some(x=>x.alive))win();return}
  draw(a,slice(ext,s,s+Ln));a.g.style.opacity=op;ln.style.opacity=op;requestAnimationFrame(step)};requestAnimationFrame(step);
 checkRed()}
/* a wrong (red) arrow waits, and leaves by itself as soon as the arrow in front of it has gone */
function checkRed(){setTimeout(()=>{arrows.filter(x=>x.alive&&x.red).forEach(a=>{const r=ray(a,arrows.filter(y=>y.alive));if(r.free)launch(a,r)})},450)}
function tap(a){if(busy||!a.alive)return;sfx.tap();const al=arrows.filter(x=>x.alive),r=ray(a,al);
 if(r.free){launch(a,r);return}
 busy=true;sfx.bad();const RD="#ee2244",first=!a.red,[hx,hy]=a.c[a.c.length-1],[dx,dy]=a.d;a.red=true;a.p.setAttribute("stroke",RD);a.h.setAttribute("fill",RD);
 const ln=mk("line",{x1:hx+.5,y1:hy+.5,x2:hx+.5+dx*r.len,y2:hy+.5+dy*r.len,stroke:RD,"stroke-width":.22,"stroke-dasharray":"0 1","stroke-linecap":"round"}),
  m=mk("circle",{cx:r.bx+.5,cy:r.by+.5,r:.4,fill:"none",stroke:RD,"stroke-width":.1});a.g.classList.add("shake");m.classList.add("pulse");

 sfx.win();confetti();const svg=$("b");[...svg.querySelectorAll("g")].filter(g=>g.id!="deco").forEach(g=>g.remove());
 mask.slice().sort((p,q)=>Math.hypot(p[0]+.5-W/2,p[1]+.5-H/2)-Math.hypot(q[0]+.5-W/2,q[1]+.5-H/2)).forEach((c,i)=>{
  const r=mk("rect",{x:c[0]+.03,y:c[1]+.03,width:.94,height:.94,rx:.3,fill:`hsl(${330+c[1]/H*45} 88% ${58+(c[0]/W)*8}%)`,style:`animation-delay:${Math.min(i*4,900)}ms`});r.setAttribute("class","rv");svg.insertBefore(r,$("deco"))});
 fit();setZ(fitZ,0,0);

/* pan + pinch */
let drag=false,ptrs=new Map(),pd0=0;const wr=$("wrap");

function pdist(){const a=[...ptrs.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}

 if(ptrs.size==2){const d=pdist(),a=[...ptrs.values()],r=wr.getBoundingClientRect();if(pd0>0)setZ(z*d/pd0,(a[0][0]+a[1][0])/2-r.left,(a[0][1]+a[1][1])/2-r.top);pd0=d;drag=true}
 else if(ptrs.size==1&&(drag||Math.hypot(e.clientX-p[2],e.clientY-p[3])>8)){drag=true;wr.scrollLeft-=dx;wr.scrollTop-=dy}});

 else{const t=e.touches[0];if(Math.hypot(t.clientX-sx0,t.clientY-sy0)>8)drag=true;if(drag){wr.scrollLeft-=t.clientX-tx;wr.scrollTop-=t.clientY-ty}tx=t.clientX;ty=t.clientY}},{passive:false});
wr.addEventListener("touchend",e=>{if(e.touches.length==1){const t=e.touches[0];tx=sx0=t.clientX;ty=sy0=t.clientY;drag=true;pd0=0}else if(!e.touches.length){pd0=0;setTimeout(()=>drag=false,80)}});
